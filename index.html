<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marina Fleet</title>
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url("images/sea.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
        }

        .hero h3 {
            font-size: 42px;
            font-weight: 700;
        }

        .hero h4 {
            font-size: 26px;
            margin-top: 10px;
        }

        img {
            width: 800px;
        }
    </style>
</head>

<body>

    <section class="hero" id="home">
        <div class="container">
            <div class="row align-items-center">

                <!-- TEXT SLIDER -->
                <div class="col-md-6 text-white">

                    <!-- STATIC HEADING -->
                    <h3>Sail Beyond Ordinary</h3>

                    <!-- h4 SLIDER -->
                    <div id="heroSlider" class="carousel slide carousel-fade mt-2" data-bs-ride="carousel">
                        <div class="carousel-inner">

                            <div class="carousel-item active">
                                <h4>Discover New Yachts</h4>
                            </div>

                            <div class="carousel-item">
                                <h4>Memorable Experience</h4>
                            </div>

                            <div class="carousel-item">
                                <h4>Discover New Boats</h4>
                            </div>

                        </div>
                    </div>

                    <!-- BUTTON -->
                    <a href="#" class="btn btn-primary mt-4">Explore</a>

                </div>


                <!-- IMAGE -->
                <div class="col-md-6 text-center">
                    <img src="boat1.png" class="img-fluid" alt="Ship">
                </div>

            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
